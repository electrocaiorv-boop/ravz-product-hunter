name: CI

# Runs the project's existing verification gates on every pull request and on
# every push to main. No new tooling is introduced: the gates here are exactly
# the ones documented in CLAUDE.md's Testing Contract.
on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing in this workflow writes to the repository, comments on a
# PR, or needs a secret.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede in-flight PR runs, but never cancel a main-branch run: every
  # commit on main should be verified on its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Tests and invariant contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the pull_request base commit exists locally for
          # the diff check below. The repository is small, so this is cheap.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # pyproject.toml declares requires-python = ">=3.12".
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile all tracked Python
        # git ls-files covers src/, tests/ and the invariant checker itself,
        # without a hand-maintained path list that could drift.
        run: python -m py_compile $(git ls-files '*.py')

      - name: Determine diff range
        # The checker's secret scan and whitespace check are diff-scoped. A
        # fresh checkout has nothing staged, so without an explicit range
        # they would be inert -- and would report green. This supplies the
        # range for the event being built; the checker FAILs in CI if it ends
        # up with no diff source at all.
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "value=${PR_BASE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            echo "value=${PUSH_BEFORE}..HEAD" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            # First push to a new branch, or a force-push: no usable "before"
            # commit, so fall back to the tip commit's own change.
            echo "value=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          else
            # Root commit: nothing to diff against. Scan the whole tree by
            # diffing against the empty tree, so the scan is never inert.
            echo "value=$(git hash-object -t tree /dev/null)..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Invariant contract check
        # Verifies the legacy byte-freeze, architectural import boundaries,
        # inversion sites, scoring-layer determinism, probability language and
        # repository hygiene, and guards that the delegated pytest contracts
        # still exist. Exits non-zero on any violation.
        env:
          PYTHONPATH: .
          INVARIANT_CHECK_DIFF_RANGE: ${{ steps.range.outputs.value }}
        run: python .claude/skills/invariant-check/check_invariants.py

      - name: Tests
        run: pytest -q

      - name: Whitespace and conflict-marker check (PR range)
        # Equivalent to `git diff --check`, but against the PR's net change --
        # nothing is ever staged in CI, so the local form would be a no-op.
        # BASE_SHA is passed via env rather than interpolated into the script.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD
